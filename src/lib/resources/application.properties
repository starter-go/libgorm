
[data]
    sources=main
    groups=default
    enable-auto-migrate = 1

[datasource "main"]
    name = default
    driver = mock
    username = user
    password = 123456
    host = localhost
    port = 0
    database = mock
    enabled = 1

[datagroup "default"]
    enabled = 1
    uri = uri:datagroup:default
    datasource = main
    table-name-prefix = libgorm_def_
